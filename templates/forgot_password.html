<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SafeDrive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/safedrive-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.login-body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0F172A;
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(220, 38, 38, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.9) 0px, transparent 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F8FAFC;
            position: relative;
            overflow-x: hidden;
        }

        .split-login-wrapper {
            width: 100%;
            max-width: 1050px;
            margin: 30px 20px;
            z-index: 10;
        }

        .split-container {
            display: flex;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
            min-height: 600px;
        }

        .split-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            position: relative;
            z-index: 2;
        }

        .split-left-inner {
            padding: 48px 56px;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .wave-container {
            position: absolute;
            top: 0;
            right: -1px;
            bottom: 0;
            width: 70px;
            pointer-events: none;
            z-index: 5;
        }

        .wave-svg {
            height: 100%;
            width: 100%;
        }

        .split-right {
            width: 50%;
            background: #0B1121;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            background-image:
                radial-gradient(circle at 75% 30%, rgba(37, 99, 235, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(220, 38, 38, 0.25) 0%, transparent 50%);
        }


        .logo-showcase-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 36px 44px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 88%;
            position: relative;
            z-index: 2;
        }
        [data-theme="dark"] .logo-showcase-card {
            background: #FFFFFF;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .right-logo-img {
            max-width: 320px;
            width: 85%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s ease;
        }

        .login-title {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin: 0 0 8px 0;
            line-height: 1.15;
        }

        .text-charcoal { color: #0F172A; }
        .text-blue { color: #2563EB; }
        .text-muted-dark { color: #64748B; font-size: 0.95rem; }

        .login-subtitle {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #64748B;
            line-height: 1.5;
        }

        /* Step Indicators */
        .step-indicators {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
        }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #E2E8F0;
            color: #64748B;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .step-dot.active {
            background: #2563EB;
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
        }

        .step-dot.completed {
            background: #10B981;
            color: #ffffff;
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: #E2E8F0;
            margin: 0 8px;
            transition: background 0.3s;
        }

        .step-line.active {
            background: #2563EB;
        }

        .form-group-modern {
            margin-bottom: 18px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control-modern {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0F172A;
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-control-modern:focus {
            background: #ffffff;
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .form-control-modern:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: #2563EB;
        }

        .input-otp {
            letter-spacing: 6px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            padding-left: 18px !important;
        }

        .btn-primary-modern {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: #2563EB;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-primary-modern:hover:not(:disabled) {
            background: #1D4ED8;
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary-modern:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-secondary-modern {
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-secondary-modern:hover:not(:disabled) {
            background: #E2E8F0;
            color: #0F172A;
        }

        .signup-link-container {
            margin-top: 24px;
            text-align: center;
            font-size: 0.92rem;
        }

        .signup-link {
            color: #2563EB;
            font-weight: 700;
            text-decoration: none;
            margin-left: 6px;
            transition: color 0.15s;
        }

        .signup-link:hover {
            color: #1D4ED8;
            text-decoration: underline;
        }

        .alert-error {
            background: #FEF2F2;
            border-left: 4px solid #DC2626;
            color: #991B1B;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            display: none;
            line-height: 1.5;
        }

        .alert-success {
            background: #ECFDF5;
            border-left: 4px solid #10B981;
            color: #065F46;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            display: none;
            line-height: 1.5;
        }

        @media (max-width: 900px) {
            .split-container {
                flex-direction: column-reverse;
                height: auto;
                max-width: 500px;
                border-radius: 24px;
            }
            .split-left { width: 100%; border-radius: 0 0 24px 24px; }
            .split-right { width: 100%; padding: 40px; min-height: 250px; border-radius: 24px 24px 0 0; }
            .wave-container { display: none; }
            .split-left-inner { padding: 40px 24px; max-width: 100%; }
        }

        /* Dark Theme Overrides */
        [data-theme="dark"] .split-container {
            background: #1E293B;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.05);
        }
        [data-theme="dark"] .split-left {
            background: #0B1121;
        }
        [data-theme="dark"] .text-charcoal { color: #ffffff; }
        [data-theme="dark"] .login-title { color: #ffffff; }
        [data-theme="dark"] .form-control-modern {
            background: #1E293B;
            border-color: #334155;
            color: #ffffff;
        }
        [data-theme="dark"] .form-control-modern::placeholder { color: #64748B; }
        [data-theme="dark"] .form-control-modern:focus { background: #0F172A; }
        [data-theme="dark"] .split-right { background: #0B1121; }
        [data-theme="dark"] .login-subtitle { color: #94A3B8; }
        [data-theme="dark"] .wave-svg path[fill="#ffffff"] { fill: #0B1121; }
        [data-theme="dark"] .step-dot { background: #334155; color: #94A3B8; }
        [data-theme="dark"] .step-line { background: #334155; }
        [data-theme="dark"] .btn-secondary-modern { background: #1E293B; border-color: #334155; color: #94A3B8; }
        [data-theme="dark"] .btn-secondary-modern:hover:not(:disabled) { background: #334155; color: #ffffff; }

        .password-toggle-btn {
            position: absolute !important;
            right: 14px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            background: transparent !important;
            border: none !important;
            padding: 6px !important;
            cursor: pointer !important;
            color: #94A3B8 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 10 !important;
            transition: color 0.2s ease !important;
            outline: none !important;
        }
        .password-toggle-btn:hover {
            color: #2563EB !important;
        }
        .with-eye {
            padding-right: 48px !important;
        }

    </style>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="login-body">
    <div style="position:absolute;top:20px;right:20px;z-index:100;">
        <div class="theme-pill" id="theme-toggle-btn" role="button" tabindex="0" title="Toggle Theme" style="display:inline-flex; background:rgba(255,255,255,0.1); border-radius:20px; padding:3px; cursor:pointer; font-size:0.75rem; font-weight:600; align-items:center; border:1px solid rgba(255,255,255,0.2); user-select:none;">
            <span class="theme-icon light-icon" style="padding:5px 12px; border-radius:15px; transition:all 0.2s;">LIGHT</span>
            <span class="theme-icon dark-icon" style="padding:5px 12px; border-radius:15px; transition:all 0.2s;">DARK</span>
        </div>
    </div>

    <div class="split-login-wrapper">
        <div class="split-container">
            <!-- Left Panel: Form -->
            <div class="split-left">
                <div class="split-left-inner">
                    <h2 class="login-title"><span class="text-charcoal">RESET</span> <span class="text-blue">PASSWORD</span></h2>

                    <!-- Dynamic Subtitle -->
                    <p class="login-subtitle" id="flow-subtitle">Enter your registered username or email to receive a secure recovery code.</p>

                    <!-- Step Progress Indicator -->
                    <div class="step-indicators">
                        <div class="step-dot active" id="dot-1">1</div>
                        <div class="step-line" id="line-1"></div>
                        <div class="step-dot" id="dot-2">2</div>
                        <div class="step-line" id="line-2"></div>
                        <div class="step-dot" id="dot-3">3</div>
                    </div>

                    <!-- Status Alerts -->
                    <div class="alert-error" id="msg-error"></div>
                    <div class="alert-success" id="msg-success"></div>

                    <!-- STEP 1: Enter Username or Email -->
                    <div id="step-1-view">
                        <form id="form-step-1" onsubmit="handleGenerateOtp(event)">
                            <div class="form-group-modern">
                                <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--text-primary); margin-bottom:6px;">Username / Email</label>
                                <div class="input-wrapper">
                                    <span class="input-icon">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                    </span>
                                    <input type="text" id="input-identifier" class="form-control-modern" placeholder="Username or Email Address" required autofocus>
                                </div>
                            </div>

                            <button type="submit" class="btn-primary-modern" id="btn-generate-otp">
                                <span>Generate OTP</span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </form>
                    </div>

                    <!-- STEP 2: Enter & Verify OTP -->
                    <div id="step-2-view" style="display: none;">
                        <form id="form-step-2" onsubmit="handleVerifyOtp(event)">
                            <div class="form-group-modern">
                                <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--text-primary); margin-bottom:6px;">Enter OTP</label>
                                <div class="input-wrapper">
                                    <input type="text" id="input-otp" class="form-control-modern input-otp" placeholder="______" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
                                </div>
                                <span style="display:block; font-size:0.8rem; color:#64748B; margin-top:6px; text-align:center;">Valid for 5 minutes. Check your registered email inbox.</span>
                            </div>

                            <button type="submit" class="btn-primary-modern" id="btn-verify-otp">
                                <span>Verify OTP</span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>

                            <button type="button" class="btn-secondary-modern" id="btn-resend-otp" onclick="handleResendOtp()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                                <span>Generate New OTP</span>
                            </button>
                        </form>
                    </div>

                    <!-- STEP 3: Reset Password -->
                    <div id="step-3-view" style="display: none;">
                        <form id="form-step-3" onsubmit="handleResetPassword(event)">
                            <div class="form-group-modern">
                                <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--text-primary); margin-bottom:6px;">New Password</label>
                                <div class="input-wrapper">
                                    <span class="input-icon">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    </span>
                                    <input type="password" id="input-new-password" class="form-control-modern with-eye" placeholder="New Password" required autocomplete="new-password">
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('input-new-password', this)" title="Show/Hide Password" tabindex="-1">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group-modern">
                                <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--text-primary); margin-bottom:6px;">Confirm New Password</label>
                                <div class="input-wrapper">
                                    <span class="input-icon">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    </span>
                                    <input type="password" id="input-confirm-password" class="form-control-modern with-eye" placeholder="Confirm New Password" required autocomplete="new-password">
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('input-confirm-password', this)" title="Show/Hide Password" tabindex="-1">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn-primary-modern" id="btn-reset-password">
                                <span>Reset Password</span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                        </form>
                    </div>

                    <div class="signup-link-container">
                        <span class="text-muted-dark">Remember your password?</span>
                        <a href="{{ url_for('login') }}" class="signup-link">Back to Sign In</a>
                    </div>
                </div>

                <!-- Wave curve matching login -->
                <div class="wave-container">
                    <svg class="wave-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
                        <path d="M0,0 Q100,250 50,500 T100,1000 L0,1000 Z" fill="#ffffff" />
                        <path d="M0,0 Q100,250 50,500 T100,1000" fill="none" stroke="url(#wave-gradient)" stroke-width="3" />
                        <defs>
                            <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#2563EB" />
                                <stop offset="50%" stop-color="#ffffff" />
                                <stop offset="100%" stop-color="#DC2626" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Right Panel: Brand Visual -->
            <div class="split-right">
                <img src="{{ url_for('static', filename='images/safedrive-logo.png') }}" alt="SafeDrive Official Logo" class="right-logo-img">
            </div>
        </div>
    </div>

    <script>
    let activeResetId = null;
    let activeResetToken = null;

    function showError(msg) {
        const errBox = document.getElementById('msg-error');
        const okBox = document.getElementById('msg-success');
        if (okBox) okBox.style.display = 'none';
        if (errBox) {
            errBox.innerText = msg;
            errBox.style.display = 'block';
        }
    }

    function showSuccess(msg) {
        const errBox = document.getElementById('msg-error');
        const okBox = document.getElementById('msg-success');
        if (errBox) errBox.style.display = 'none';
        if (okBox) {
            okBox.innerText = msg;
            okBox.style.display = 'block';
        }
    }

    function clearMessages() {
        const errBox = document.getElementById('msg-error');
        const okBox = document.getElementById('msg-success');
        if (errBox) errBox.style.display = 'none';
        if (okBox) okBox.style.display = 'none';
    }


    function togglePasswordVisibility(fieldId, btn) {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const isPassword = field.type === 'password';
        field.type = isPassword ? 'text' : 'password';
        if (isPassword) {
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            btn.setAttribute('title', 'Hide Password');
        } else {
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            btn.setAttribute('title', 'Show Password');
        }
    }

    // STEP 1: Generate OTP
    async function handleGenerateOtp(e) {
        if (e) e.preventDefault();
        clearMessages();

        const identifier = document.getElementById('input-identifier').value.trim();
        if (!identifier) {
            showError('Please enter your username or registered email.');
            return;
        }

        const btn = document.getElementById('btn-generate-otp');
        btn.disabled = true;
        btn.innerHTML = '<span>Generating OTP...</span>';

        try {
            const resp = await fetch('/api/forgot_password/generate_otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: identifier })
            });
            const data = await resp.json();

            if (data.success) {
                activeResetId = data.reset_id;
                showSuccess(data.message || 'If the account exists and has a registered email, an OTP has been sent.');

                // Advance to Step 2
                document.getElementById('step-1-view').style.display = 'none';
                document.getElementById('step-2-view').style.display = 'block';
                document.getElementById('flow-subtitle').innerText = 'Enter the 6-digit verification code received in your registered email.';

                document.getElementById('dot-1').className = 'step-dot completed';
                document.getElementById('line-1').className = 'step-line active';
                document.getElementById('dot-2').className = 'step-dot active';

                const otpInput = document.getElementById('input-otp');
                if (otpInput) {
                    otpInput.value = '';
                    otpInput.focus();
                }
            } else {
                showError(data.error || 'Failed to generate OTP. Please try again.');
            }
        } catch (err) {
            showError('Network error while requesting OTP. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Generate OTP</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
        }
    }

    // Re-generate OTP
    async function handleResendOtp() {
        const btn = document.getElementById('btn-resend-otp');
        btn.disabled = true;
        btn.innerHTML = '<span>Sending new OTP...</span>';
        await handleGenerateOtp(null);
        btn.disabled = false;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg><span>Generate New OTP</span>';
    }

    // STEP 2: Verify OTP
    async function handleVerifyOtp(e) {
        if (e) e.preventDefault();
        clearMessages();

        const otp = document.getElementById('input-otp').value.trim();
        if (!otp || otp.length !== 6) {
            showError('Please enter the full 6-digit OTP code.');
            return;
        }

        const btn = document.getElementById('btn-verify-otp');
        btn.disabled = true;
        btn.innerHTML = '<span>Verifying...</span>';

        try {
            const resp = await fetch('/api/forgot_password/verify_otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reset_id: activeResetId, otp: otp })
            });
            const data = await resp.json();

            if (data.success) {
                activeResetToken = data.reset_token;
                showSuccess('OTP verified successfully! Please enter your new password.');

                // Advance to Step 3
                document.getElementById('step-2-view').style.display = 'none';
                document.getElementById('step-3-view').style.display = 'block';
                document.getElementById('flow-subtitle').innerText = 'Create and confirm your new account password.';

                document.getElementById('dot-2').className = 'step-dot completed';
                document.getElementById('line-2').className = 'step-line active';
                document.getElementById('dot-3').className = 'step-dot active';

                const pwdInput = document.getElementById('input-new-password');
                if (pwdInput) pwdInput.focus();
            } else {
                if (data.expired) {
                    showError('OTP expired. Please generate a new OTP.');
                } else {
                    showError(data.error || 'Incorrect OTP code. Please check your email and try again.');
                }
            }
        } catch (err) {
            showError('Network error while verifying OTP. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Verify OTP</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        }
    }

    // STEP 3: Reset Password
    async function handleResetPassword(e) {
        if (e) e.preventDefault();
        clearMessages();

        const pwd = document.getElementById('input-new-password').value;
        const confirmPwd = document.getElementById('input-confirm-password').value;

        if (!pwd || !confirmPwd) {
            showError('Please complete both password fields.');
            return;
        }

        if (pwd !== confirmPwd) {
            showError('Passwords do not match. Please verify and try again.');
            return;
        }

        const btn = document.getElementById('btn-reset-password');
        btn.disabled = true;
        btn.innerHTML = '<span>Updating Password...</span>';

        try {
            const resp = await fetch('/api/forgot_password/reset_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    reset_id: activeResetId,
                    reset_token: activeResetToken,
                    password: pwd,
                    confirm_password: confirmPwd
                })
            });
            const data = await resp.json();

            if (data.success) {
                showSuccess(data.message || 'Password reset successfully! Redirecting to sign in...');
                document.getElementById('dot-3').className = 'step-dot completed';
                setTimeout(() => {
                    window.location.href = data.redirect || '/login';
                }, 1500);
            } else {
                showError(data.error || 'Failed to reset password. Please start over.');
            }
        } catch (err) {
            showError('Network error while resetting password. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Reset Password</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        }
    }
    </script>
</body>
</html>
