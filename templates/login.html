<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='images/safedrive-logo.png') }}" type="image/png">
    <style>
        .login-body {
            background-color: #050b14;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(220, 38, 38, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPPHBhdGggZD0iTTAgMTBoNDBNMTAgMHY0MCIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDMpIiBzdHJva2Utd2lkdGg9IjEiLz48L3N2Zz4=');
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .split-login-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .split-container {
            display: flex;
            width: 100%;
            max-width: 1280px;
            height: 750px;
            background: #F8FAFC;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
        }

        .split-left {
            position: relative;
            width: 38%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .split-left-inner {
            padding: 60px 40px 60px 60px;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .login-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .text-charcoal { color: #0F172A; }
        .text-blue { color: #2563EB; }

        .login-subtitle {
            color: #475569;
            font-size: 1.05rem;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .form-group-modern {
            margin-bottom: 22px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #94A3B8;
            display: flex;
        }

        .form-control-modern {
            width: 100%;
            padding: 15px 16px 15px 48px;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            color: #0F172A;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .form-control-modern::placeholder { color: #94A3B8; }
        .form-control-modern:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: #ffffff;
        }


        .password-toggle-btn {
            position: absolute !important;
            right: 14px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            background: transparent !important;
            border: none !important;
            padding: 6px !important;
            cursor: pointer !important;
            color: #94A3B8 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 10 !important;
            transition: color 0.2s ease !important;
            outline: none !important;
        }
        .password-toggle-btn:hover {
            color: #2563EB !important;
        }
        .with-eye {
            padding-right: 48px !important;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: #94A3B8;
            display: flex;
            transition: 0.2s;
        }
        .password-toggle:hover { color: #475569; }

        .btn-primary-modern {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.3);
        }
        .btn-primary-modern:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(37, 99, 235, 0.4);
        }

        .auth-links-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin: 20px 0 30px 0;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-weight: 500;
            cursor: pointer;
        }
        .custom-checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid #CBD5E1;
            accent-color: #2563EB;
            cursor: pointer;
        }
        .forgot-link {
            color: #2563EB;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-link:hover { color: #1D4ED8; text-decoration: underline; }

        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
        }
        .divider-line {
            flex: 1;
            border-bottom: 1px solid #E2E8F0;
        }
        .divider-text {
            padding: 0 15px;
            color: #94A3B8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }
        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #E2E8F0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .social-btn:hover { background: #F8FAFC; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .social-btn.facebook { color: #1877F2; }
        .social-btn.google { color: #DB4437; }
        .social-btn.twitter { color: #1DA1F2; }

        .signup-link-container {
            text-align: center;
            font-size: 0.95rem;
        }
        .text-muted-dark { color: #64748B; font-weight: 500; }
        .signup-link { color: #2563EB; font-weight: 700; margin-left: 5px; text-decoration: none; }
        .signup-link:hover { color: #1D4ED8; text-decoration: underline; }

        .wave-container {
            position: absolute;
            right: -60px;
            top: -50px;
            height: calc(100% + 100px);
            width: 120px;
            z-index: 5;
            pointer-events: none;
        }
        .wave-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(5px 0 15px rgba(0,0,0,0.08));
        }

        /* Right Panel */
        .split-right {
            position: relative;
            width: 62%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            background: #F8FAFC;
        }

        .split-right::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.4;
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 1;
        }


        .logo-showcase-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 36px 44px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 88%;
            position: relative;
            z-index: 2;
        }
        [data-theme="dark"] .logo-showcase-card {
            background: #FFFFFF;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .right-logo-img {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

                .alert-success {
            background: #ECFDF5;
            border-left: 4px solid #10B981;
            color: #065F46;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .alert-error {
            background: #FEF2F2;
            border-left: 4px solid #DC2626;
            color: #991B1B;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .split-left-inner { padding: 50px 30px; }
        }

        @media (max-width: 900px) {
            .split-container {
                flex-direction: column-reverse;
                height: auto;
                max-width: 500px;
                border-radius: 24px;
            }
            .split-left { width: 100%; border-radius: 0 0 24px 24px; }
            .split-right { width: 100%; padding: 40px; min-height: 250px; border-radius: 24px 24px 0 0; }
            .wave-container { display: none; }
            .split-left-inner { padding: 40px; max-width: 100%; }
        }

        /* Dark Theme Overrides for Login Page */
        [data-theme="dark"] .split-container {
            background: #1E293B;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.05);
        }
        [data-theme="dark"] .split-left {
            background: #0B1121;
        }
        [data-theme="dark"] .text-charcoal { color: #ffffff; }
        [data-theme="dark"] .login-title { color: #ffffff; }
        [data-theme="dark"] .form-control-modern {
            background: #1E293B;
            border-color: #334155;
            color: #ffffff;
        }
        [data-theme="dark"] .form-control-modern::placeholder { color: #64748B; }
        [data-theme="dark"] .form-control-modern:focus { background: #0F172A; }
        [data-theme="dark"] .social-btn {
            background: #1E293B;
            border-color: #334155;
        }
        [data-theme="dark"] .social-btn:hover { background: #334155; }
        [data-theme="dark"] .divider-text { color: #64748B; }
        [data-theme="dark"] .divider-line { border-color: #334155; }
        [data-theme="dark"] .split-right { background: #0B1121; }
        [data-theme="dark"] .remember-me { color: #94A3B8; }
        [data-theme="dark"] .login-subtitle { color: #94A3B8; }
        [data-theme="dark"] .wave-svg path[fill="#ffffff"] { fill: #0B1121; }
        </style>

    <script>
        (function() {
            const saved = localStorage.getItem('safedrive_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="login-body">
    <div style="position:absolute;top:20px;right:20px;z-index:100;"><div class="theme-pill" id="theme-toggle-btn" style="display:inline-flex; background:var(--border-color); border-radius:20px; padding:3px; cursor:pointer; font-size:0.75rem; font-weight:600; align-items:center; border:1px solid rgba(0,0,0,0.1); user-select:none;">
    <span class="theme-icon light-icon" style="padding:5px 12px; border-radius:15px; transition:all 0.2s;">LIGHT</span>
    <span class="theme-icon dark-icon" style="padding:5px 12px; border-radius:15px; transition:all 0.2s;">DARK</span>
</div></div>
    <div class="split-login-wrapper">
        <div class="split-container">
            <!-- Left Panel: Form -->
            <div class="split-left">
                <div class="split-left-inner">
                    <h2 class="login-title"><span class="text-charcoal">WELCOME</span> <span class="text-blue">BACK</span></h2>
                    <p class="login-subtitle">Stay alert. Stay safe. Drive safe.</p>

                    {% if message %}
                    <div class="alert-success">
                        {{ message }}
                    </div>
                    {% endif %}
                    {% if error %}
                    <div class="alert-error">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="form-group-modern">
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <input type="text" name="username" class="form-control-modern" placeholder="Username / Email" required>
                            </div>
                        </div>
                        <div class="form-group-modern">
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" name="password" id="password-field" class="form-control-modern with-eye" placeholder="Password" required autocomplete="current-password">
                                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password-field', this)" title="Show/Hide Password" tabindex="-1">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary-modern">
                            SIGN IN
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </button>

                        <div class="auth-links-modern">
                            <label class="remember-me">
                                <input type="checkbox" name="remember" class="custom-checkbox"> Remember me
                            </label>
                            <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
                        </div>
                    </form>

                    <div class="divider-container">
                        <span class="divider-line"></span>
                        <span class="divider-text">OR</span>
                        <span class="divider-line"></span>
                    </div>



                    <div class="signup-link-container">
                        <span class="text-muted-dark">Don't have an account?</span>
                        <a href="{{ url_for('signup') }}" class="signup-link">Sign Up</a>
                    </div>
                </div>

                <!-- The elegant wave curve -->
                <div class="wave-container">
                    <svg class="wave-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
                        <path d="M0,0 Q100,250 50,500 T100,1000 L0,1000 Z" fill="#ffffff" />
                        <path d="M0,0 Q100,250 50,500 T100,1000" fill="none" stroke="url(#wave-gradient)" stroke-width="3" />
                        <defs>
                            <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#2563EB" />
                                <stop offset="50%" stop-color="#ffffff" />
                                <stop offset="100%" stop-color="#DC2626" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Right Panel: Visual -->
            <div class="split-right">
                <div class="logo-showcase-card">
                    <img src="{{ url_for('static', filename='images/safedrive-logo.png') }}" alt="SafeDrive Official Logo" class="right-logo-img">
                </div>
            </div>
        </div>
    </div>


    <script>
        function togglePasswordVisibility(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
            if (isPassword) {
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
                btn.setAttribute('title', 'Hide Password');
            } else {
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                btn.setAttribute('title', 'Show Password');
            }
        }
        function togglePassword() {
            togglePasswordVisibility('password-field', document.querySelector('.password-toggle-btn') || document.querySelector('.password-toggle'));
        }
    </script>


<script>
// Global protection against downloading images and videos
document.addEventListener('contextmenu', function(e) {
    if (e.target.nodeName === 'IMG' || e.target.nodeName === 'VIDEO') {
        e.preventDefault();
    }
});
document.addEventListener('dragstart', function(e) {
    if (e.target.nodeName === 'IMG') {
        e.preventDefault();
    }
});
</script>
</body>

</html>
